# Release entry: testflight/* tags. Upload success is not internal availability.
# Apple webhook starts testflight-verify; release-notifier also schedules a watchdog.
workflows:
  ios-validation:
    name: iPad - validate and build without signing
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.5
      xcode: '26.6'
      cocoapods: default
    scripts:
      - &check_configuration
        name: Check iOS configuration
        script: |
          set -euo pipefail
          python3 tool/check_ios_release.py
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
          flutter --version
      - &get_dependencies
        name: Resolve Flutter dependencies
        script: |
          set -euo pipefail
          flutter pub get
          cd widgetbook_gallery
          flutter pub get
      - &analyze
        name: Analyze application
        # Existing legacy warnings remain visible; analyzer errors still block release.
        script: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - &test
        name: Run application tests
        script: flutter test --no-pub
      - &install_pods
        name: Install application pods
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Build unsigned iOS release
        script: flutter build ios --release --no-codesign --no-pub
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      # Regenerated by pod install; commit it after the Flutter upgrade build.
      - ios/Podfile.lock

  testflight-release:
    name: TestFlight - build and upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'testflight/*'
          include: true
      cancel_previous_builds: false
    environment:
      flutter: 3.47.5
      xcode: '26.6'
      node: 22.17.0
      cocoapods: default
      groups:
        - yellow_ribbon_ci
    scripts:
      - *check_configuration
      - name: Test release verification and webhook logic
        script: node --test tool/release/*.test.cjs infra/release-notifier/test/*.test.cjs
      - name: Verify Apple access and reserve release identity
        script: node tool/release/run.cjs preflight
      - *get_dependencies
      - *analyze
      - *test
      - *install_pods
      - name: Obtain or create current Apple signing assets
        script: bash tool/release/sign-ios.sh
      - name: Build signed IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --build-name="$YR_RELEASE_VERSION" \
            --build-number="$YR_RELEASE_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - release.json
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      scripts:
        - name: Record CI completion for automatic lock recovery
          script: node tool/release/run.cjs build-complete
      email:
        recipients:
          - e2755699@gmail.com
        notify:
          success: false
          failure: true

  testflight-verify:
    name: TestFlight - notify verified result
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      node: 22.17.0
      groups:
        - yellow_ribbon_ci
    scripts:
      - name: Validate release source identity
        script: |
          set -euo pipefail
          [[ "$YR_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          # Run this pinned notification tag; the App commit is checked against its record.
      - name: Read terminal Apple result and prepare notification
        script: node tool/release/run.cjs verify
    artifacts:
      - release-result/*
    publishing:
      email:
        recipients:
          - e2755699@gmail.com
        notify:
          success: true
          failure: true

  testflight-access-check:
    name: TestFlight - read-only API access check
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      node: 22.17.0
      groups:
        - yellow_ribbon_ci
    scripts:
      - name: Verify existing build 11 without uploading
        script: node tool/release/run.cjs inspect 1.0.1 11

  testflight-signing-check:
    name: TestFlight - validate automatic provisioning without upload
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      xcode: '26.6'
      groups:
        - yellow_ribbon_ci
    scripts:
      - name: Fetch or create signing assets on a clean runner
        script: bash tool/release/sign-ios.sh
      - name: Fetch again using the same persistent key
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files yellowribbon.studygrowingsystem.app \
            --type IOS_APP_STORE --strict-match-identifier --create \
            --api-unauthorized-retries 0 --api-server-error-retries 2
